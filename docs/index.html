he body without taking centre stage.","Тепло ощущается, но уравновешено фруктом и кислотой.":"The warmth is perceptible yet balanced by fruit and acidity.","Спиртовая волна вылезает над фруктом и тянется в финиш.":"A spirit wave pokes above the fruit and stretches into the finish.","Жжёт нёбо и горло: горячий хвост глушит вкус.":"It burns the palate and throat: a hot tail muffles the flavour.","Как спирт ведёт себя в бокале: спрятан в плоде или вылезает горячей волной?":"How does the spirit behave in the glass: hidden inside the fruit, or poking out in a hot wave?","Согревает в груди":"Warms the chest","Жжёт в финале":"Burns in the finish","Жгучие ноздри (ретро-нос)":"Burning nostrils (retronasal)","Подогревает фрукт":"Warms up the fruit","Маскирует кислоту":"Masks the acidity","Сушит вкус":"Dries the palate","Алкоголь выпирает: спиртовая волна перекрывает фрукт.":"The alcohol protrudes: a spirit wave overshadows the fruit.","Спирт жжёт: горячая волна давит на нёбо и глушит финиш.":"The spirit burns: a hot wave presses on the palate and mutes the finish.","Спирт интегрирован: тепло не выпирает над фруктом.":"The spirit is integrated: the warmth does not stick out above the fruit.","Спирт жгучий — горячий дисбаланс":"Burning spirit — a hot imbalance","Алкоголь выпирает над фруктом":"Alcohol protrudes above the fruit","Жгучий спирт глушит вкус и финиш — классический горячий дисбаланс. Проверьте кислотность/фруктовое ядро, температуру подачи или смягчите ожидания в вердикте.":"A burning spirit muffles the flavour and finish — a classic hot imbalance. Check the acidity/fruit core, the serving temperature, or soften the verdict.","Спиртовая волна вылезает над фруктом: у гармоничного вина алкоголь держится внутри вкуса. Проверьте калибровку «Алкоголя» и фруктовость в «Рту».":"A spirit wave pokes above the fruit: in a harmonious wine the alcohol stays inside the flavour. Check the “Alcohol” calibration and the fruitiness in the “Palate”.","Такое бывает у горячих урожаев и able","Формат фото не поддерживается браузером. Сконвертируйте его в JPEG или PNG.":"The photo format is not supported by the browser. Convert it to JPEG or PNG.","Не удалось прочитать изображение":"Failed to read the image","Не удалось закодировать фото":"Failed to encode the photo","Не удалось прочитать blob":"Failed to read the blob","[db] localStorage переполнен — данные могут не сохраниться":"[db] localStorage overflow — the data may not persist","IndexedDB API отсутствует":"The IndexedDB API is missing","[db] IndexedDB недоступна (file:// или приватный режим) — включён фолбэк на localStorage (~5 МБ).":"[db] IndexedDB is unavailable (file:// or private mode) — the localStorage fallback is enabled (~5 MB).","Файл бэкапа не является корректным JSON-объектом.":"The backup file is not a valid JSON object.","Это бэкап другого приложения (метка app не совпадает). Импорт отклонён.":"This is a backup of another app (the app label doesn’t match). The import is rejected.","В бэкапе отсутствует массив tastings.":"The backup has no tastings array.","В бэкапе нет ни одной валидной записи.":"The backup contains no valid records.","IndexedDB недоступна — включён фолбэк на localStorage (~5 МБ).":"IndexedDB is unavailable — the localStorage fallback is enabled (~5 MB).",Кислотность_axis:"Acidity",Фруктовость:"Fruit",Минеральность:"Minerality","Сладость (ощущ.)":"Perceived sweetness","сахар маскирует":"sugar masks","форма волны":"the wave shape","кислота подчёркивает вязкость":"acidity emphasises the viscosity","сахар сглаживает":"sugar smooths",сахар:"sugar","глицерин / ножки":"glycerol / legs","новый дуб":"new oak","автолиз / МЛО-плотность":"autolysis / MLF density","финиш 8+ сек держит ядро":"an 8+ s finish holds the core","финиш: минеральный":"a mineral finish","кислота сушит":"acidity dries","танины сушат":"tannins dry","Primary Crunch":"Primary Crunch","Ripe Balance":"Ripe Balance","Tertiary Depth":"Tertiary Depth","свежий, хрустящий первичный сок":"a fresh, crunchy primary juice","сочная, округлая спелость":"a juicy, rounded ripeness","уваренный, вяленый, ликёрный тон выдержки":"a cooked, dried, liqueur-like tone of age","Универсальный бокал среднего объёма":"A universal all-purpose glass","Декантация не обязательна":"Decanting is not required","Малый бокал для креплёных (120–150 мл)":"A small fortified glass (120–150 ml)","Тюльпановый флейта-бокал (сохраняет перляж)":"A tulip flute (preserves the perlage)","Охладить 3+ часа в холодильнике; не декантировать":"Chill for 3+ hours in the fridge; do not decant","Малый десертный бокал":"A small dessert glass","Бокал для полнотелых белых (Burgundy-профиль)":"A full-bodied white glass (Burgundy profile)","Возможна короткая аэрация 15–30 минут":"A short 15–30 minute aeration is possible","Бокал для лёгких белых (суженный кверху)":"A light white glass (tapered towards the top)","Бокал для розе / лёгких белых":"A rosé / light white glass","Крупный бокал Bordeaux-профиля (500+ мл)":"A large Bordeaux-profile glass (500+ ml)","Декантировать 1–2 часа":"Decant for 1–2 hours","Аэрация 30–60 минут в декантере":"Aerate for 30–60 minutes in a decanter","Бокал Burgundy-профиля (для ароматных лёгких красных)":"A Burgundy-profile glass (for aromatic light reds)","Достаточно 15–20 минут в бокале":"15–20 minutes in the glass is enough","Универсальный бокал для красных":"A universal red wine glass","Крепость 14%+: подавайте у нижней границы диапазона, чтобы алкоголь не «горел».":"ABV 14%+: serve at the bottom of the range so that the alcohol doesn’t “burn”.","Высокий алкоголь: слегка снизьте температуру подачи.":"High alcohol: lower the serving temperature slightly.","Вино пока не собрано: если это молодь — дайте время в бутылке, если старое — пейте без ожиданий.":"The wine is not yet together: if it is young — give it time in the bottle; if old — drink without expectations.","на спаде — пить сейчас":"on the decline — drink now","идеальная гармония полифенолов, шлейф третичных нот.":"a perfect harmony of polyphenols, a trail of tertiary notes.","На пике — золотое плато":"At peak — the golden plateau","На пике":"At peak","Фаза закрытости (Dumb phase) — спит":"The dumb phase — asleep",Закрыто:"Closed","Молодое — набор структуры":"Young — building structure","Молодое — восходящий потенциал":"Young — rising potential","На спаде — рекомендуется пить":"Declining — drink up","🍓 Свежий первичный сок: хрустящие ягоды, кислота без шероховатостей.":"🍓 Fresh primary juice: crunchy berries, acidity without rough edges.","⚠️ Фаза закрытости: первичный фрукт уснул, танин обнажён. Не тревожить бутылку.":"⚠️ The dumb phase: the primary fruit is asleep, the tannin is exposed. Do not disturb the bottle.","🍂 Спад: затухание фрукта, высыхание танинов, оксидативный скелет.":"🍂 The decline: a fading fruit, drying tannins, an oxidative skeleton.","Вино набирает тело, кислота и дуб постепенно притираются.":"The wine is gaining body; the acidity and oak are gradually mellowing.","Креплёное плато":"A fortified plateau","Сладкий долгожитель":"A sweet immortal","Пить молодым (свежесть)":"Drink young (freshness)","Великий потенциал (Dumb Phase)":"Grand potential (Dumb Phase)","Классическая выдержка":"Classic ageing","Высокая, вибрирующая, острая атака":"High, vibrating, a sharp attack","Цитрусы, зелень и минералы при свежем регистре фрукта — слюна побежит сразу.":"Citrus, green notes and minerals with a fresh fruit register — the saliva will flow at once.","Сглаженная, купольная, мягкая":"Smoothed, domed, soft","Вяленый фрукт и джем гасят остриё: ожидаем округлую арку без резкой атаки.":"Dried fruit and jam dampen the edge: expect a rounded arch without a sharp attack.","Отметьте дескрипторы на колесе — гипотеза соберётся сама.":"Mark descriptors on the wheel — the hypothesis will assemble itself.","Сбалансированная, умеренная":"Balanced, moderate","Состав букета без явного крена в свежесть или уваренность — ровная кислотность.":"A bouquet composition with no explicit tilt to freshness or cookedness — an even acidity.","Плотный, структурный каркас":"A dense, structural frame","Тёмные ягоды, новый дуб или третичность — ожидаем Medium+ / High и держащий скелет.":"Dark berries, new oak or tertiarity — expect Medium+ / High and a holding skeleton.","Шелковистый, низкий или бесшовный":"Silky, low or seamless","Белое/розе без структурных маркеров — танины почти неощутимы.":"A white/rosé without structural markers — the tannins are almost imperceptible.","Лёгкая цветочность — текстура скользкая, без вяжущего скелета.":"A light florality — a slippery texture, without an astringent skeleton.","Умеренный, округлый":"Moderate, rounded","Без явных структурных якорей — ожидаем мягкую подложку без жёсткости.":"No explicit structural anchors — expect a soft base without harshness.","Плотное, кремовое, обволакивающее":"Dense, creamy, enveloping","Дуб, МЛО-тоны или сухофрукты дают вес: экстракт держит середину нёба.":"Oak, MLF tones or dried fruit give weight: the extract holds the mid-palate.","Лёгкое, линейное, хрустящее":"Light, linear, crunchy","Свежий минеральный профиль — тонкая вертикаль без лишней плотности.":"A fresh mineral profile — a thin vertical line without extra density.","Пока колесо пусто — гипотезе не на что опереться.":"The wheel is empty — the hypothesis has nothing to lean on.","Среднее, аккуратное":"Medium, neat","Умеренный экстракт: ожидаем точную середину без провалов и напора.":"A moderate extract: expect a precise middle without dips or pressure.","«Выдающееся», но послевкусие короче 3 секунд":"“Outstanding”, but the finish is shorter than 3 seconds","По BLIC Outstanding требует длинного финиша. Перемерьте каудалии или смягчите вердикт.":"By BLIC, Outstanding requires a long finish. Re-measure the caudalies or soften the verdict.","«Выдающееся» при отмеченном дисбалансе":"“Outstanding” with a marked imbalance","Баланс — первая буква BLIC. Дисбаланс блокирует «Выдающееся»: пересмотрите либо вердикт, либо раздел «Баланс».":"Balance is the first letter of BLIC. An imbalance blocks “Outstanding”: reconsider either the verdict or the “Balance” section.","Молодое вино с «возрастным» цветом":"A young wine with an “ageing” colour","Кирпичные/янтарные тона обычно говорят о развитии. Проверьте цвет или стадию развития.":"Brick/amber tones usually speak of development. Check the colour or the development stage.","Статус «Чистое», но дефекты отмечены":"The status is “Clean”, but faults are marked","Либо снимите дефекты, либо смените статус на «С дефектом».":"Either remove the faults or change the status to “Faulty”.","«С дефектом», но конкретный дефект не указан":"“Faulty”, but no specific fault is given","Уточните тип дефекта (TCA, редукция, окисление…) — иначе вердикт Faulty будет неаргументированным.":"Specify the fault type (TCA, reduction, oxidation…) — otherwise the Faulty verdict will be unargued.","Возможная терруарная стилистика":"A possible terroir styling","на 1 • — не обязательно дефект: животные/серные тона в лёгкой степени бывают стилистикой хозяйства. Вердикт качества не блокируется.":"at 1 • — not necessarily a fault: animal/sulphur tones at low intensity can be the winery’s style. The quality verdict is not blocked.","В карточке выбран другой уровень. WSET разрешает корректировку по вкусу, но проверьте калибр.":"A different level is chosen in the card. WSET allows a correction by taste, but check the calibration.","Игристое без описания перляжа":"A sparkling wine without a perlage description","Для игристых WSET ждёт наблюдения о пузырьках и муссе.":"For sparkling wines WSET expects observations on the bubbles and the mousse.","Минеральные ароматы без подтверждения в финише/заметках":"Mineral aromas without confirmation in the finish/notes","Ось «Минеральность» усилится, если отметить минеральный акцент финиша или добавить каменистые тона в заметки.":"The “Minerality” axis will strengthen if you mark a mineral finish accent or add stony tones to the notes.","Высокие танины при лёгком теле":"High tannins
